name: Durable storage reference tests
on:
  pull_request:
  push:
    branches:
      - feat/llvm-tenant-lock-queues
permissions:
  contents: read
jobs:
  sqlite-host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify physical source identity at exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify_ci_checkout_head.sh
      - name: Exercise adversarial Git checkout identity cases
        run: python3 -m unittest discover -s tests -p test_ci_checkout_head_20261106.py -v
      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run reference tests
        run: ctest --test-dir build --output-on-failure

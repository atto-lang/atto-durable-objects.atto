name: Durable storage reference tests
on:
  pull_request:
  push:
    branches:
      - feat/llvm-tenant-lock-queues
permissions:
  contents: read
jobs:
  sqlite-host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR/push head and raw source tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash scripts/verify-native-tree.sh .
          echo "DURABLE_STORAGE_VERIFIED_HEAD=$EXPECTED_SHA"
      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B "$RUNNER_TEMP/durable-storage" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build "$RUNNER_TEMP/durable-storage" --parallel 2
      - name: Check exact CTest manifest and execute
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/durable-storage" --show-only > "$RUNNER_TEMP/ctest-manifest.txt"
          cat "$RUNNER_TEMP/ctest-manifest.txt"
          test "$(grep -Ec '^[[:space:]]*Test[[:space:]]*#[0-9]+:' "$RUNNER_TEMP/ctest-manifest.txt")" -eq 5
          grep -Eq 'Total Tests: 5$' "$RUNNER_TEMP/ctest-manifest.txt"
          for name in sqlite_durable_storage_test durable_isolate_queues durable_persisted_fence_guard durable_tenant_fault_quarantine durable_sqlite_vfs_fault; do
            grep -Eq "^[[:space:]]*Test[[:space:]]*#[0-9]+:[[:space:]]+$name$" "$RUNNER_TEMP/ctest-manifest.txt"
          done
          ctest --test-dir "$RUNNER_TEMP/durable-storage" --output-on-failure --verbose
          echo "DURABLE_STORAGE_TESTS_EXECUTED_HEAD=$(git rev-parse HEAD)"

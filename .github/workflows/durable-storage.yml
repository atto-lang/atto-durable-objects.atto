name: Durable storage reference tests
on:
  pull_request:
  push:
    branches:
      - feat/llvm-tenant-lock-queues
permissions:
  contents: read
jobs:
  sqlite-host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Execute focused history guard under sanitizers
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -Inative/include native/tests/snapshot_admission_v1_test.cpp -lsqlite3 -o "$RUNNER_TEMP/snapshot-history"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 timeout 30 "$RUNNER_TEMP/snapshot-history"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run reference tests
        run: ctest --test-dir build --output-on-failure

name: Durable Objects native exact-head tests
on:
  pull_request:
    paths:
      - 'native/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  address-undefined:
    name: ${{ matrix.compiler }} ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git ls-tree -r HEAD native CMakeLists.txt
      - name: Install system SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build and execute native sanitizer test
        env:
          CXX: ${{ matrix.compiler }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          for test_name in durable_isolate_queues_test durable_tenant_fault_quarantine_test durable_sqlite_vfs_fault_test; do
            "$CXX" -std=c++17 -pthread -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
              -fno-omit-frame-pointer -fsanitize=address,undefined \
              -Inative/include native/tenant_runtime.cpp "native/tests/$test_name.cpp" \
              -lsqlite3 -o "$RUNNER_TEMP/$test_name"
            "$RUNNER_TEMP/$test_name"
          done
          echo "EXACT_HEAD_NATIVE_ASAN_UBSAN_PASS=${{ github.event.pull_request.head.sha || github.sha }}"
  native-ctest:
    name: Native CTest ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build and execute assert-enabled CTest
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          cmake -S . -B "$RUNNER_TEMP/durable-ctest" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build "$RUNNER_TEMP/durable-ctest" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/durable-ctest" --output-on-failure --verbose
          echo "EXACT_HEAD_CTEST_${{ matrix.build_type }}_PASS=$EXPECTED_SHA"
  thread-sanitizer:
    name: GCC ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact source HEAD and compile with TSan
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          for test_name in durable_isolate_queues_test durable_tenant_fault_quarantine_test durable_sqlite_vfs_fault_test; do
            g++ -std=c++17 -pthread -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
              -fno-omit-frame-pointer -fsanitize=thread -Inative/include \
              native/tenant_runtime.cpp "native/tests/$test_name.cpp" \
              -lsqlite3 -o "$RUNNER_TEMP/$test_name-tsan"
            "$RUNNER_TEMP/$test_name-tsan"
          done
          echo "EXACT_HEAD_NATIVE_TSAN_PASS=$EXPECTED_SHA"

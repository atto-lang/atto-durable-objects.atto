name: Durable Objects native exact-head tests
on:
  pull_request:
    paths:
      - 'native/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  address-undefined:
    name: ${{ matrix.compiler }} ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git ls-tree -r HEAD native CMakeLists.txt
      - name: Install system SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build and execute native sanitizer test
        env:
          CXX: ${{ matrix.compiler }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          "$CXX" -std=c++17 -pthread -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
            -fno-omit-frame-pointer -fsanitize=address,undefined \
            -Inative/include native/tenant_runtime.cpp native/tests/durable_isolate_queues_test.cpp \
            -lsqlite3 -o "$RUNNER_TEMP/durable-native-test"
          "$RUNNER_TEMP/durable-native-test"
          "$CXX" -std=c++17 -pthread -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
            -fno-omit-frame-pointer -fsanitize=address,undefined \
            -Inative/include native/tests/actor_sync_test.cpp -lsqlite3 \
            -o "$RUNNER_TEMP/actor-sync-native-test"
          "$RUNNER_TEMP/actor-sync-native-test"
          "$CXX" -std=c++17 -pthread -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
            -fno-omit-frame-pointer -fsanitize=address,undefined \
            -Inative/include native/tests/actor_sync_hardening_test.cpp -lsqlite3 \
            -o "$RUNNER_TEMP/actor-sync-hardening-test"
          "$RUNNER_TEMP/actor-sync-hardening-test"
          "$CXX" -std=c++17 -pthread -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
            -fno-omit-frame-pointer -fsanitize=address,undefined \
            -Inative/include native/tests/actor_sync_crash_recovery_test.cpp -lsqlite3 \
            -o "$RUNNER_TEMP/actor-sync-crash-test"
          "$RUNNER_TEMP/actor-sync-crash-test"
          echo "ACTOR_SYNC_TWO_PROCESS_ASAN_UBSAN_PASS=$EXPECTED_SHA"
          echo "ACTOR_SYNC_HARDENING_ASAN_UBSAN_PASS=$EXPECTED_SHA"
          echo "EXACT_HEAD_NATIVE_ASAN_UBSAN_PASS=${{ github.event.pull_request.head.sha || github.sha }}"
  thread-sanitizer:
    name: GCC ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact source HEAD and compile with TSan
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          g++ -std=c++17 -pthread -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
            -fno-omit-frame-pointer -fsanitize=thread -Inative/include \
            native/tenant_runtime.cpp native/tests/durable_isolate_queues_test.cpp \
            -lsqlite3 -o "$RUNNER_TEMP/durable-native-tsan"
          "$RUNNER_TEMP/durable-native-tsan"
          echo "EXACT_HEAD_NATIVE_TSAN_PASS=$EXPECTED_SHA"
